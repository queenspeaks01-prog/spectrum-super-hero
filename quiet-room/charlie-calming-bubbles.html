    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),

  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {

        hostPort != null ||

#charlie-bubble-play .bubble::after{content:&#x27;&#x27;;position:absolute;inset:8px;border-radius:50%;border-top:3px solid light-dark(#ffffffc0,#ead7ff88);transform:rotate(-32deg)}
#charlie-bubble-play .bubble.popped{animation:charlie-pop .45s ease-out forwards;pointer-events:none}
#charlie-bubble-play .field.resting .bubble{visibility:hidden}

#charlie-bubble-play .status{margin-top:14px;min-height:24px;text-align:center}
@keyframes charlie-drift{from{transform:translate(-50%,-50%) translateY(9px)}to{transform:translate(-50%,-50%) translateY(-9px)}}
@keyframes charlie-pop{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
@media(prefers-reduced-motion:reduce){#charlie-bubble-play .bubble{animation:none}#charlie-bubble-play .bubble.popped{animation:none;opacity:0}}
@media(max-width:420px){#charlie-bubble-play .activity{padding:16px}#charlie-bubble-play .welcome{gap:14px;padding-right:0}#charlie-bubble-play h2{font-size:21px}#charlie-bubble-play .portrait{width:70px;height:128px}#charlie-bubble-play .bubble{width:62px;height:62px}}
#charlie-bubble-play .voice-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
