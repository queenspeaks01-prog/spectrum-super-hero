  }

    position: relative;
  }

    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;

  }

  .form-range {

  }

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }

                } else {

                }

        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);

      return;
    }

        id = decodeURIComponent(href.slice(1));

#emily-peaceful-sounds .actions .play{background:var(--gold);border-color:var(--gold);color:light-dark(#fff,#2e281a)}

&lt;div class=&quot;voice-controls&quot; role=&quot;group&quot; aria-label=&quot;Emily’s voice&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;hear-emily&quot;&gt;Hear Emily&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;stop-voice&quot; disabled&gt;Stop voice&lt;/button&gt;&lt;/div&gt;

&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;emily-peaceful-sounds&#x27;);
const play=root.querySelector(&#x27;.play&#x27;),stop=root.querySelector(&#x27;.stop&#x27;),status=root.querySelector(&#x27;.status&#x27;),slider=root.querySelector(&#x27;input&#x27;),volumeValue=root.querySelector(&#x27;.volume-value&#x27;),scene=root.querySelector(&#x27;.scene&#x27;),buttons=root.querySelectorAll(&#x27;[data-sound]&#x27;);
const sounds={rain:{name:&#x27;gentle rain&#x27;,icon:&#x27;🌧️&#x27;},waves:{name:&#x27;soft waves&#x27;,icon:&#x27;🌊&#x27;},chimes:{name:&#x27;quiet chimes&#x27;,icon:&#x27;🎐&#x27;}};
let selected=&#x27;rain&#x27;,volume=20,playing=false,context=null,master=null,chimeTimer=null,generation=0;
function render(){buttons.forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.sound===selected)));scene.textContent=sounds[selected].icon;play.disabled=playing;stop.disabled=!playing;slider.value=String(volume);volumeValue.textContent=volume+&#x27;%&#x27;;}
function save(){window.openai?.setWidgetState?.({modelContent:{activity:&#x27;Emily peaceful sounds&#x27;,selectedSound:selected},privateContent:{selected,volume}})?.catch(()=&gt;{});}
function stopSound(message=&#x27;Stopped. We can sit quietly together.&#x27;){
generation++;clearInterval(chimeTimer);chimeTimer=null;const old=context,oldMaster=master;context=null;master=null;playing=false;
if(old){try{const t=old.currentTime;oldMaster.gain.cancelScheduledValues(t);oldMaster.gain.setValueAtTime(oldMaster.gain.value,t);oldMaster.gain.linearRampToValueAtTime(0,t+.06);}catch(e){}setTimeout(()=&gt;{old.close().catch(()=&gt;{});},90);}
status.textContent=message;render();
}
function makeNoise(ctx,type,destination){
const buffer=ctx.createBuffer(1,ctx.sampleRate*8,ctx.sampleRate),data=buffer.getChannelData(0);let previous=0;
for(let i=0;i&lt;data.length;i++){const white=Math.random()*2-1;previous=.97*previous+.03*white;data[i]=type===&#x27;waves&#x27;?previous*5:white*.35;}
// Match both ends of the loop to avoid a click at the seam.
for(let i=0;i&lt;256;i++){const mix=i/255;data[i]*=mix;data[data.length-1-i]*=mix;}
const source=ctx.createBufferSource();source.buffer=buffer;source.loop=true;
const filter=ctx.createBiquadFilter();filter.type=&#x27;lowpass&#x27;;filter.frequency.value=type===&#x27;rain&#x27;?1900:850;
const gain=ctx.createGain();gain.gain.value=type===&#x27;waves&#x27;?.38:.45;source.connect(filter);filter.connect(gain);gain.connect(destination);source.start();
if(type===&#x27;waves&#x27;){const swell=ctx.createOscillator(),depth=ctx.createGain();swell.frequency.value=.11;depth.gain.value=.20;swell.connect(depth);depth.connect(gain.gain);swell.start();}
}
function chime(ctx,destination,index){const now=ctx.currentTime;const notes=[392,523.25,440,659.25];const o=ctx.createOscillator(),g=ctx.createGain();o.type=&#x27;sine&#x27;;o.frequency.value=notes[index%notes.length];g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.32,now+.12);g.gain.exponentialRampToValueAtTime(.0001,now+3.2);o.connect(g);g.connect(destination);o.start(now);o.stop(now+3.3);}
play.addEventListener(&#x27;click&#x27;,async()=&gt;{
if(playing)return;const Audio=window.AudioContext||window.webkitAudioContext;
if(!Audio){status.textContent=&#x27;Sound isn’t available here. We can have a quiet moment instead.&#x27;;return;}
const token=++generation;playing=true;render();status.textContent=&#x27;Getting your sound ready…&#x27;;
try{const ctx=new Audio();context=ctx;master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);await ctx.resume();if(token!==generation)return;
const t=ctx.currentTime;master.gain.linearRampToValueAtTime(volume/100*.35,t+.8);
if(selected===&#x27;chimes&#x27;){let i=0;chime(ctx,master,i++);const destination=master;chimeTimer=setInterval(()=&gt;{if(token===generation)chime(ctx,destination,i++);},4000);}else makeNoise(ctx,selected,master);
status.textContent=&#x27;Listening to &#x27;+sounds[selected].name+&#x27;.&#x27;;
}catch(e){if(token===generation)stopSound(&#x27;Sound couldn’t start. Tap Play to try again.&#x27;);}
});

        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;

    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&

        size.scale === globalThis.devicePixelRatio &&

        Number.isFinite(size.height) &&

        size.height <= 10_000

      }
    } catch {

    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
