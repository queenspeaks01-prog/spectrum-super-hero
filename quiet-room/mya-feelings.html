  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  const postToHost = (type, payload) =&gt; {

    if (globalThis.navigator.userActivation?.isActive === true) {

  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

      nextState,

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

      new CustomEvent(&quot;openai:set_globals&quot;, {

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },

    postToHost(&quot;height&quot;, {

    &quot;message&quot;,

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

          &quot;message&quot;,
          (event) =&gt; {

#mya-feelings-play{--ink:light-dark(#54282c,#fbe6e8);--paper:light-dark(#fff7f5,#2b1a20);--red:light-dark(#b83b47,#f4a0a9);--soft:light-dark(#fff,#36232b);--line:light-dark(#eed8d7,#6e4550);font-family:ui-rounded,system-ui,sans-serif;color:var(--ink)}
#mya-feelings-play .activity{background:var(--paper);border-radius:24px;padding:24px}

#mya-feelings-play .hero{width:105px;height:200px;object-fit:contain;flex-shrink:0}
#mya-feelings-play h2{font-size:24px;line-height:1.25;font-weight:600;margin:0 0 12px}
#mya-feelings-play h3{font-size:18px;font-weight:600;margin:0 0 14px}
#mya-feelings-play p{font-size:16px;line-height:1.5;margin:0}
#mya-feelings-play .choices{margin-top:22px}

#mya-feelings-play button{font:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation}
#mya-feelings-play .feeling{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 8px;border:1px solid var(--line);background:var(--soft);border-radius:18px}
#mya-feelings-play .face{font-size:28px;line-height:1}
#mya-feelings-play .feeling[aria-pressed=true]{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 10%,var(--soft));padding:11px 7px}
#mya-feelings-play .response{margin-top:20px;padding:18px;border-radius:18px;background:color-mix(in srgb,var(--red) 8%,var(--soft))}
#mya-feelings-play .response[hidden]{display:none}
#mya-feelings-play .response strong{display:block;font-size:17px;font-weight:600;margin-bottom:8px}
#mya-feelings-play .response .prompt{margin-top:12px}
#mya-feelings-play .supports{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
#mya-feelings-play .support{border:1px solid var(--line);border-radius:22px;background:var(--soft);min-height:44px;padding:10px 14px}
#mya-feelings-play .support[aria-pressed=true]{border-color:var(--red);background:color-mix(in srgb,var(--red) 13%,var(--soft))}
#mya-feelings-play .support-reply{margin-top:16px}
#mya-feelings-play .skip{display:block;margin:16px auto 0;min-height:44px;border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;padding:8px}
#mya-feelings-play .quiet{margin-top:20px;text-align:center;font-size:14px}
@media(max-width:430px){#mya-feelings-play .activity{padding:16px}#mya-feelings-play .welcome{gap:14px;padding-right:0}#mya-feelings-play .hero{width:78px;height:155px}#mya-feelings-play h2{font-size:21px}#mya-feelings-play .feelings{grid-template-columns:repeat(2,minmax(0,1fr))}#mya-feelings-play .response{padding:14px}}
#mya-feelings-play .voice-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
#mya-feelings-play .voice-controls button{border:1px solid var(--line);border-radius:22px;background:var(--soft);padding:10px 16px;min-height:44px}
#mya-feelings-play .voice-controls .hear-mya{background:var(--red);color:light-dark(#fff,#2b1a20);border-color:var(--red)}
#mya-feelings-play .voice-controls button:disabled{opacity:.45;cursor:default}
#mya-feelings-play .voice-status{margin-top:8px;font-size:14px}

let player=null,voiceGeneration=0;
function stopVoice(message=&#x27;Sound is off until you tap Hear Mya.&#x27;){
voiceGeneration++;
if(player){player.pause();player.removeAttribute(&#x27;src&#x27;);player.load();player=null;}
stop.disabled=true;hear.disabled=false;voiceStatus.textContent=message;
}
function playRecording(key,token,onDone){
if(token!==voiceGeneration)return;
const audio=new Audio(recordings[key]);player=audio;audio.volume=.75;
audio.onplaying=()=&gt;{if(token===voiceGeneration)voiceStatus.textContent=&#x27;Mya is speaking. You can stop whenever you like.&#x27;;};
audio.onended=()=&gt;{if(token!==voiceGeneration)return;player=null;onDone();};
audio.onerror=()=&gt;{if(token===voiceGeneration)stopVoice(&#x27;The recording couldn’t play here. Mya’s words are still available to read.&#x27;);};
audio.play().catch(()=&gt;{if(token===voiceGeneration)stopVoice(&#x27;Tap Hear Mya to try again. You can still read her words.&#x27;);});
}
hear.addEventListener(&#x27;click&#x27;,()=&gt;{
stopVoice();const token=++voiceGeneration;
stop.disabled=false;voiceStatus.textContent=&#x27;Getting Mya’s voice ready…&#x27;;
const queue=[chosen||&#x27;greeting&#x27;];if(chosen&amp;&amp;support)queue.push(support);
function next(){if(token!==voiceGeneration)return;const key=queue.shift();if(key){playRecording(key,token,next);}else{player=null;stop.disabled=true;voiceStatus.textContent=&#x27;Take your time. Tap Hear Mya to listen again.&#x27;;}}
next();
});
stop.addEventListener(&#x27;click&#x27;,()=&gt;stopVoice(&#x27;Stopped. Take your time.&#x27;));
root.querySelectorAll(&#x27;[data-feeling],[data-support],.skip&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;stopVoice(&#x27;Tap Hear Mya to listen to these words.&#x27;)));
window.addEventListener(&#x27;pagehide&#x27;,()=&gt;stopVoice());
document.addEventListener(&#x27;visibilitychange&#x27;,()=&gt;{if(document.hidden)stopVoice();});
window.addEventListener(&#x27;openai:set_globals&#x27;,()=&gt;{if(player)stopVoice();});

render();apply(window.openai?.widgetState?.privateContent);
window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;apply(e.detail?.globals?.widgetState?.privateContent));
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
