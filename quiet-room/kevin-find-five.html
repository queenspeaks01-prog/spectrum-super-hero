  }

  .form-check-input {
    position: relative;
  }

    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;

  }

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

      nextState,

          typeof value === &quot;function&quot; ||

      typeof parsedState !== &quot;object&quot; ||

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      new CustomEvent(&quot;openai:set_globals&quot;, {

      throw persistenceError();
    }

    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,

      statePersistence,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

#kevin-picture-game{--ink:light-dark(#254e37,#e5f5e9);--paper:light-dark(#f2fbf3,#1a2c22);--green:light-dark(#2f784b,#a4deb6);--soft:light-dark(#fffef7,#2b4132);--edge:light-dark(#c6e2ce,#53705c);font-family:ui-rounded,system-ui,sans-serif;color:var(--ink)}
#kevin-picture-game .activity{padding:24px;background:var(--paper);border-radius:24px}
#kevin-picture-game .welcome{display:flex;align-items:center;gap:20px;padding-right:35px}
#kevin-picture-game .hero{width:92px;height:170px;object-fit:contain;flex-shrink:0}
#kevin-picture-game h2{font-size:24px;line-height:1.25;font-weight:600;margin:0 0 10px}
#kevin-picture-game p{font-size:16px;line-height:1.5;margin:0}
#kevin-picture-game button{font:inherit;cursor:pointer;touch-action:manipulation;color:var(--ink)}
#kevin-picture-game .voice-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#kevin-picture-game .control{min-height:44px;padding:10px 18px;border:1px solid var(--edge);border-radius:24px;background:var(--soft)}
#kevin-picture-game .hear{background:var(--green);border-color:var(--green);color:light-dark(#fff,#1a2c22)}
#kevin-picture-game button:disabled{opacity:.45;cursor:default}
#kevin-picture-game .voice-status{text-align:center;font-size:14px;min-height:22px;margin-top:8px}
#kevin-picture-game .field{position:relative;height:405px;margin-top:12px;background:radial-gradient(ellipse,color-mix(in srgb,var(--green) 7%,transparent),transparent 70%)}
#kevin-picture-game .object{position:absolute;left:var(--x);top:var(--y);width:100px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid transparent;border-radius:25px;background:var(--soft);box-shadow:0 8px 20px color-mix(in srgb,var(--green) 9%,transparent);transform:translate(-50%,-50%);animation:kevin-float 6s ease-in-out infinite alternate;animation-delay:var(--delay)}
#kevin-picture-game .pic{font-size:48px;line-height:1.1;display:flex;align-items:center;justify-content:center;height:54px}
#kevin-picture-game .object[aria-pressed=true]{border-color:var(--green);background:color-mix(in srgb,var(--green) 15%,var(--soft));animation:none}
#kevin-picture-game .check{position:absolute;right:7px;top:4px;font-size:21px;font-weight:600;visibility:hidden}
#kevin-picture-game .object[aria-pressed=true] .check{visibility:visible}
#kevin-picture-game .pillow{display:block;width:60px;height:39px;border-radius:13px 10px 13px 10px;background:light-dark(#c9dff2,#94b9d7);border:3px solid light-dark(#9dbbd5,#abcce7);box-shadow:inset 0 0 0 4px light-dark(#e4eff8,#c5dbea);transform:rotate(-8deg)}
#kevin-picture-game .field.paused .object{animation-play-state:paused}
#kevin-picture-game .result{text-align:center;min-height:28px;font-size:20px;font-weight:500}
#kevin-picture-game .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}
@keyframes kevin-float{from{transform:translate(-50%,-50%) translateY(5px) rotate(-2deg)}to{transform:translate(-50%,-50%) translateY(-5px) rotate(2deg)}}
@media(prefers-reduced-motion:reduce){#kevin-picture-game .object{animation:none}}
@media(max-width:430px){#kevin-picture-game .activity{padding:16px}#kevin-picture-game .welcome{padding-right:0;gap:14px}#kevin-picture-game .hero{width:74px;height:145px}#kevin-picture-game h2{font-size:21px}#kevin-picture-game .object{width:76px;height:90px}#kevin-picture-game .pic{font-size:42px}}
#kevin-picture-game .find-list{margin:0 0 16px}
#kevin-picture-game .find-list h3{text-align:center;font-size:18px;font-weight:500;margin:0 0 12px}
#kevin-picture-game .key{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
#kevin-picture-game .key li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:15px;background:var(--soft);font-size:14px}
#kevin-picture-game .key-pic{display:flex;height:35px;align-items:center;justify-content:center;font-size:28px;line-height:1}
#kevin-picture-game .key-pic .pillow{width:35px;height:23px;border-width:2px;box-shadow:none}
#kevin-picture-game .key-check{visibility:hidden;position:absolute;top:0;right:4px;font-size:16px;color:var(--green)}
#kevin-picture-game .key .matched{background:color-mix(in srgb,var(--green) 17%,var(--soft))}
#kevin-picture-game .key .matched .key-check{visibility:visible}

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();

      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
